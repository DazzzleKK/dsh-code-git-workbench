<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Code</title>
<link rel="stylesheet" href="vendor/codemirror.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="app" id="app">
  <header class="toolbar">
    <button class="icon-btn" id="toggle-tree" title="Toggle file tree" aria-label="Toggle file tree">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <div class="crumbs" id="crumbs"><span class="muted">No file selected</span></div>
    <div class="toolbar-actions">
      <button class="icon-btn" id="reload" title="Reload file" aria-label="Reload file">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn" id="save" title="Save (Ctrl+S)" disabled>Save</button>
    </div>
  </header>

  <div class="main">
    <aside class="tree-pane" id="tree-pane">
      <div class="tree-head">
        <select class="root-select" id="root-select" title="Project workspace" aria-label="Project workspace"></select>
        <button class="icon-btn small" id="refresh-tree" title="Refresh tree" aria-label="Refresh tree">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="tree-filter">
        <input id="tree-search" type="search" placeholder="Filter files" spellcheck="false" autocomplete="off" />
      </div>
      <div class="tree" id="tree" role="tree"></div>
      <div class="tree-foot" id="tree-foot"></div>
    </aside>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>

    <section class="editor-pane">
      <div class="tabs" id="tabs"></div>
      <div class="editor-wrap">
        <div class="editor" id="editor"></div>
        <div class="empty" id="empty">
          <div class="empty-icon">⌘</div>
          <div class="empty-title">Select a file</div>
          <div class="empty-hint">The project tree on the left is rooted at this session's working directory.</div>
        </div>
      </div>
      <footer class="status" id="status"></footer>
    </section>
  </div>
</div>

<div class="modal-layer" id="modal-layer" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-text" id="modal-text"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script src="vendor/codemirror.js"></script>
<script src="vendor/mode/clike.js"></script>
<script src="vendor/mode/javascript.js"></script>
<script src="vendor/mode/python.js"></script>
<script src="vendor/mode/xml.js"></script>
<script src="vendor/mode/css.js"></script>
<script src="vendor/mode/htmlmixed.js"></script>
<script src="vendor/mode/markdown.js"></script>
<script src="vendor/mode/yaml.js"></script>
<script src="vendor/mode/sql.js"></script>
<script src="vendor/mode/shell.js"></script>
<script src="vendor/mode/powershell.js"></script>
<script src="vendor/addon/edit/matchbrackets.js"></script>
<script src="vendor/addon/edit/closebrackets.js"></script>
<script src="vendor/addon/search/search.js"></script>
<script src="vendor/addon/search/jump-to-line.js"></script>
<script src="vendor/addon/selection/active-line.js"></script>
<script src="app.js"></script>
</body>
</html>
